<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Scott Glasgow">
  <style>
    .tile { fill: #FF6B35; }
    .mark { stroke: #FFFFFF; }
    /* Nudge the tile brighter against dark browser chrome, where a mid-tone
       orange reads noticeably darker than it does on a light tab strip. */
    @media (prefers-color-scheme: dark) {
      .tile { fill: #FF7F4A; }
    }
  </style>
  <rect class="tile" width="100" height="100" rx="22"/>
  <!-- "S" drawn as a path rather than text so it renders identically
       regardless of which fonts the viewer has installed. -->
  <path class="mark"
        d="M64 38.5C64 31 57 26.5 50 26.5C43 26.5 36 30 36 37C36 43.5 42 46.5 50 49C58 51.5 64 54.5 64 62C64 69.5 57 73.5 50 73.5C43 73.5 36 69 36 61.5"
        fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
