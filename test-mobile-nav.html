<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Nav Test</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --text-color: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(250, 250, 250, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        header nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .logo {
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-decoration: none;
            color: var(--text-color);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            position: relative;
            z-index: 1002;
        }

        .hamburger-line {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text-color);
            margin: 5px 0;
            transition: transform 0.3s, opacity 0.3s;
        }

        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: var(--bg-color);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 40px;
                z-index: 1001;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity 0.3s, visibility 0.3s;
            }

            .nav-links.active {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }

            .nav-links a {
                font-size: 1.8rem;
                font-weight: 600;
            }
        }

        main {
            padding-top: 100px;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="#" class="logo">SCOTT GLASGOW</a>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <ul class="nav-links">
                <li><a href="#projects">Projects</a></li>
                <li><a href="#publications">Publications</a></li>
                <li><a href="#speaking">Speaking</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Mobile Navigation Test</h1>
        <p>Resize your browser to mobile width and click the hamburger menu.</p>
    </main>

    <script>
        console.log("Script starting...");

        // Mobile Menu Toggle
        (function () {
            var toggle = document.querySelector(".mobile-menu-toggle");
            var navLinks = document.querySelector(".nav-links");

            console.log("Toggle element:", toggle);
            console.log("NavLinks element:", navLinks);

            if (!toggle || !navLinks) {
                console.error("Elements not found!");
                return;
            }

            var lines = toggle.querySelectorAll(".hamburger-line");
            var links = navLinks.querySelectorAll("a");

            console.log("Lines found:", lines.length);
            console.log("Links found:", links.length);

            function closeMenu() {
                console.log("Closing menu");
                navLinks.classList.remove("active");
                document.body.style.overflow = "";
                lines[0].style.transform = "none";
                lines[1].style.opacity = "1";
                lines[2].style.transform = "none";
            }

            function openMenu() {
                console.log("Opening menu");
                navLinks.classList.add("active");
                document.body.style.overflow = "hidden";
                lines[0].style.transform = "rotate(45deg) translate(5px, 5px)";
                lines[1].style.opacity = "0";
                lines[2].style.transform = "rotate(-45deg) translate(5px, -5px)";
            }

            toggle.addEventListener("click", function () {
                console.log("Toggle clicked!");
                if (navLinks.classList.contains("active")) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });

            for (var i = 0; i < links.length; i++) {
                links[i].addEventListener("click", closeMenu);
            }

            console.log("Event listeners attached");
        })();
    </script>
</body>

</html>
