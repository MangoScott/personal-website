<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital@0;1&display=block">
<style>
  :root{
    --accent:#FF6B35;
    --ink:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:'Inter',sans-serif;
    background:#121212;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
  }
  .card{
    position:relative;width:1200px;height:630px;overflow:hidden;
    background:
      radial-gradient(circle at 13% 50%, rgba(255,107,53,.20) 0%, rgba(255,107,53,0) 52%),
      linear-gradient(135deg,#1e1e1e 0%,#131313 52%,#191919 100%);
  }
  /* soft directional sheen echoing the site's angular motif */
  .sheen{position:absolute;inset:0;background:
      linear-gradient(115deg,rgba(255,255,255,0) 46%,rgba(255,255,255,.030) 62%,rgba(255,255,255,0) 78%),
      radial-gradient(ellipse 70% 90% at 96% 8%, rgba(255,255,255,.028) 0%, rgba(255,255,255,0) 70%)}

  /* portrait, bleeding off the left edge */
  .portrait{
    position:absolute;left:48px;top:50%;transform:translateY(-50%);
    width:398px;height:398px;border-radius:50%;
    border:7px solid var(--accent);
    box-shadow:0 0 0 1px rgba(255,107,53,.35), 0 26px 70px rgba(0,0,0,.55),
               0 0 90px rgba(255,107,53,.20);
    background:#161616;
  }
  .portrait img{
    display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;
  }

  /* right-hand content column */
  .col{
    position:absolute;left:500px;right:58px;top:50%;transform:translateY(-50%);
  }
  .name{
    font-size:73px;font-weight:800;letter-spacing:-.028em;line-height:1;
    color:var(--ink);white-space:nowrap;
  }
  .tag{
    margin-top:19px;
    font-family:'Playfair Display',Georgia,serif;font-style:italic;
    font-size:29px;line-height:1.25;color:rgba(255,255,255,.74);
  }
  .rule{
    margin:33px 0 29px;height:1px;width:100%;
    background:linear-gradient(90deg,rgba(255,107,53,.85) 0%,rgba(255,107,53,.85) 74px,
               rgba(255,255,255,.11) 74px,rgba(255,255,255,.11) 100%);
  }
  .proof{display:flex;gap:38px}
  .item .role{
    font-size:12.5px;font-weight:700;letter-spacing:.155em;text-transform:uppercase;
    color:var(--accent);margin-bottom:7px;
  }
  .item .who{font-size:25px;font-weight:600;letter-spacing:-.012em;color:rgba(255,255,255,.95)}

  /* wordmark */
  .mark{
    position:absolute;right:64px;bottom:46px;display:flex;align-items:center;gap:11px;
  }
  .mark .sg{
    width:31px;height:31px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.28);
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;letter-spacing:.02em;color:rgba(255,255,255,.62);
  }
  .mark .dom{font-size:20px;font-weight:500;letter-spacing:.005em;color:rgba(255,255,255,.5)}

  .bar{position:absolute;left:0;right:0;bottom:0;height:6px;
       background:linear-gradient(90deg,#FF6B35 0%,#ff8a5c 46%,#FF6B35 100%)}
</style>
</head>
<body>
  <div class="card">
    <div class="sheen"></div>

    <div class="portrait"><img src="portrait.png" alt="Scott Glasgow"></div>

    <div class="col">
      <div class="name">SCOTT GLASGOW</div>
      <div class="tag">Using technology to improve lives at scale.</div>
      <div class="rule"></div>
      <div class="proof">
        <div class="item"><div class="role">Founder</div><div class="who">FinMango</div></div>
        <div class="item"><div class="role">Building</div><div class="who">Fresho</div></div>
        <div class="item"><div class="role">Speaker</div><div class="who">2&times; TEDx</div></div>
      </div>
    </div>

    <div class="mark">
      <div class="sg">SG</div>
      <div class="dom">sglasgow.com</div>
    </div>

    <div class="bar"></div>
  </div>
</body>
</html>
